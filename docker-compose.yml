# Docker Compose — Claims Pipeline Infrastructure
# ================================================
# Services:
#   - cassandra:  Apache Cassandra 4.1 (port 9042)
#   - zookeeper:  Confluent Zookeeper (port 2181) — Kafka dependency
#   - kafka:      Confluent Kafka (port 9092) — event streaming
#   - api:        FastAPI scoring service (port 8000)
#   - mlflow:     MLflow model registry (port 5000)
#
# Usage:
#   docker-compose up -d                # Start all services
#   docker-compose up -d cassandra      # Start only Cassandra
#   docker-compose logs -f api          # Tail API logs

version: "3.8"

services:
  # ------------------------------------------------------------------
  # Apache Cassandra 4.1
  # ------------------------------------------------------------------
  cassandra:
    image: cassandra:4.1
    container_name: claims-cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=claims-cluster
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe cluster"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - cassandra-data:/var/lib/cassandra

  # ------------------------------------------------------------------
  # Zookeeper (required by Kafka)
  # ------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: claims-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ------------------------------------------------------------------
  # Apache Kafka
  # ------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: claims-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ------------------------------------------------------------------
  # FastAPI Scoring Service
  # ------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claims-api
    ports:
      - "8000:8000"
    depends_on:
      cassandra:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data:ro          # Parquet data (read-only)
      - ./models:/app/models:ro       # Compiled model + threshold
    restart: on-failure

  # ------------------------------------------------------------------
  # MLflow Model Registry
  # ------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.0
    container_name: claims-mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow.db
      - MLFLOW_ARTIFACT_STORE_URI=/mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000"]

volumes:
  cassandra-data:
  kafka-data:
  mlflow-data:
